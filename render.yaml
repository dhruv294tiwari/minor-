services:
  # Single Unified Full-Stack Service (FastAPI + React Frontend)
  - type: web
    name: mait-ai-assistant
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python -m app.seed.seed_data"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.6-27b
      - key: LLM_API_KEY
        sync: false
